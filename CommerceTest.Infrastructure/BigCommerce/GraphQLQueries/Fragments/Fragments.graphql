fragment ProductFields on Product {
    id
    entityId
    name
    plainTextDescription
    defaultImage {
        ...ImageFields
    }
    images {
        edges {
            node {
                ...ImageFields
            }
        }
    }
    reviewSummary {
        summationOfRatings
        numberOfReviews
    }
    prices {
        price {
            ...MoneyFields
        }
        priceRange {
            min {
                ...MoneyFields
            }
            max {
                ...MoneyFields
            }
        }
        salePrice {
            ...MoneyFields
        }
        retailPrice {
            ...MoneyFields
        }
        saved {
            ...MoneyFields
        }
        bulkPricing {
            minimumQuantity
            maximumQuantity
            ... on BulkPricingFixedPriceDiscount {
                price
            }
            ... on BulkPricingPercentageDiscount {
                percentOff
            }
            ... on BulkPricingRelativePriceDiscount {
                priceAdjustment
            }
        }
    }
    brand {
        name
    }
    reviewSummary {
        summationOfRatings
        numberOfReviews
    }
    productOptions {
        edges {
            node {
                displayName
                isRequired
                isVariantOption
                entityId
                ... on MultipleChoiceOption {
                    values(first: 10) {
                        edges {
                            node {
                                entityId
                                label
                                isDefault
                                ... on SwatchOptionValue {
                                    hexColors
                                    imageUrl(width: 200)
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

fragment ImageFields on Image {
    url320wide: url(width: 320)
    url640wide: url(width: 640)
    url960wide: url(width: 960)
    url1280wide: url(width: 1280)
}

fragment MoneyFields on Money {
    value
    currencyCode
}
